name: Test cljfmt setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          cljfmt: 'latest'
      - name: Assert cljfmt is available
        run: |
          echo "Checking cljfmt..."
          which cljfmt || (echo "FAIL: cljfmt not found on PATH" && exit 1)
          cljfmt --version || true
          echo "PASS"
