name: Test cljfmt input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          cljfmt: 'latest'
      - name: Assert cljfmt is installed
        run: |
          echo "Checking cljfmt installation..."
          if ! command -v cljfmt &>/dev/null; then
            echo "FAIL: cljfmt command not found"
            exit 1
          fi
          CLJFMT_VERSION="$(cljfmt --version 2>&1 || true)"
          echo "cljfmt version output: $CLJFMT_VERSION"
          echo "PASS: cljfmt is available"
