name: Test Leiningen setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Java
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq default-jdk-headless
      - id: setup
        uses: .
        with:
          lein: '2.11.2'
          github-token: ${{ github.token }}
      - name: Assert lein is available
        run: |
          echo "Checking lein version..."
          LEIN_VERSION=$(lein version 2>&1 || true)
          echo "lein version output: $LEIN_VERSION"
          if echo "$LEIN_VERSION" | grep -qi "leiningen"; then
            echo "PASS: lein is available"
          else
            echo "FAIL: lein not found or wrong version"
            exit 1
          fi
