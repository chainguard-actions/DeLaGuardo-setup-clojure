name: Test tools-deps input (deprecated)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          tools-deps: '1.11.1.1413'
      - name: Assert clojure CLI is available via tools-deps
        run: |
          echo "Checking clojure CLI installation via tools-deps..."
          if ! command -v clojure &>/dev/null; then
            echo "FAIL: clojure command not found"
            exit 1
          fi
          CLJ_VERSION="$(clojure --version 2>&1 || true)"
          echo "clojure version output: $CLJ_VERSION"
          echo "PASS: clojure is available"
