name: Test clj-kondo setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          clj-kondo: 'latest'
          github-token: ${{ github.token }}
      - name: Assert clj-kondo is available
        run: |
          echo "Checking clj-kondo version..."
          KONDO_VERSION=$(clj-kondo --version 2>&1 || true)
          echo "clj-kondo version output: $KONDO_VERSION"
          if echo "$KONDO_VERSION" | grep -qi "clj-kondo"; then
            echo "PASS: clj-kondo is available"
          else
            echo "FAIL: clj-kondo not found"
            exit 1
          fi
