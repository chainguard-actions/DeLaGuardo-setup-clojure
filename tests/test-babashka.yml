name: Test setup-clojure with Babashka
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUNNER_TOOL_CACHE: /tmp/hostedtoolcache
      ACTIONS_CACHE_URL: ''
      ACTIONS_RUNTIME_TOKEN: ''
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare tool cache dir
        run: mkdir -p /tmp/hostedtoolcache
      - id: action
        uses: .
        with:
          bb: '1.3.191'
          github-token: ${{ github.token }}
      - name: Assert bb is installed
        run: |
          echo "Checking babashka installation..."
          if ! command -v bb &>/dev/null; then
            echo "FAIL: bb command not found"
            exit 1
          fi
          BB_VERSION=$(bb --version 2>&1 || true)
          echo "bb version output: $BB_VERSION"
          if echo "$BB_VERSION" | grep -q "1.3.191"; then
            echo "PASS: babashka 1.3.191 is installed"
          else
            echo "FAIL: expected babashka 1.3.191 but got: $BB_VERSION"
            exit 1
          fi
