name: Test cljstyle setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          cljstyle: 'latest'
      - name: Assert cljstyle is available
        run: |
          echo "Checking cljstyle..."
          which cljstyle || (echo "FAIL: cljstyle not found on PATH" && exit 1)
          cljstyle version || true
          echo "PASS"
