name: Test cmd-exe-workaround input (deprecated)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          cli: 'latest'
          cmd-exe-workaround: 'latest'
      - name: Assert clojure CLI is available (cmd-exe-workaround is deprecated, cli takes precedence)
        run: |
          echo "Checking clojure CLI installation..."
          if ! command -v clojure &>/dev/null; then
            echo "FAIL: clojure command not found"
            exit 1
          fi
          CLJ_VERSION="$(clojure --version 2>&1 || true)"
          echo "clojure version output: $CLJ_VERSION"
          echo "PASS: clojure is available"
