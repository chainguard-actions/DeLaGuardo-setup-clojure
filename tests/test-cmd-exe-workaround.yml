name: Test cmd-exe-workaround (deprecated) input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          cmd-exe-workaround: 'latest'
      - name: Assert clojure/deps.clj is available
        run: |
          echo "Checking clojure availability after cmd-exe-workaround..."
          which clojure || (echo "FAIL: clojure not found on PATH" && exit 1)
          clojure --version || true
          echo "PASS"
